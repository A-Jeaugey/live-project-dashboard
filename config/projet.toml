titre = "Première soutenance"
titre_court = "Soutenance 1"
semaine_du = 2027-01-04
nuit = 3

[[echeances]]
cle = "soutenance-2"
titre = "Deuxième soutenance"
titre_court = "Soutenance 2"
semaine_du = 2027-03-29
nuit = 4

[[echeances]]
cle = "soutenance-finale"
titre = "Soutenance finale"
titre_court = "Finale"
semaine_du = 2027-05-31
