# Réglages non secrets du tableau de bord. Les secrets vont dans `.env`, jamais ici.

[projet]
nom = "5 Nights at EPITA"
fuseau = "Europe/Paris"

# Noms exacts des labels GitLab qui définissent les colonnes du tableau.
# La comparaison ignore la casse et la façon dont les accents sont encodés.
[colonnes]
idee = "Idée"
a_faire = "À faire"
en_cours = "En cours"

[seuils]
jours_sans_activite = 14   # une tâche « En cours » est dite dormante au-delà
heures_relecture = 48      # une merge request est signalée au-delà
fenetre_fait_jours = 14    # durée d'affichage des tâches fermées dans la colonne « Fait »

# Dernière version jouable. regle = "pipeline" (dernier pipeline réussi de la branche par défaut),
# "tag" (dernier tag correspondant à motif_tag) ou "commit" (dernier commit de la branche par défaut).
[version_jouable]
regle = "pipeline"
motif_tag = "jouable-*"

# Labels de domaine. La couleur sert si le label n'existe pas encore dans GitLab.
[[domaines]]
nom = "gameplay"
couleur = "#3F7BD9"

