# Calendrier officiel. `semaine_du` est le lundi de la semaine de l'échéance : le compte à rebours
# vise ce lundi. Quand la date réelle est connue, ajouter `date_exacte = AAAA-MM-JJ`.
# `nuit` numérote les cinq échéances à préparer. `jalon` (facultatif) donne le titre du jalon
# GitLab s'il diffère de `titre`.
[[echeances]]
cle = "groupes"
titre = "Constitution des groupes"
titre_court = "Groupes"
semaine_du = 2026-10-19

[[echeances]]
cle = "cdst"
titre = "Remise du CdST"
titre_court = "CdST"
semaine_du = 2026-12-07
nuit = 1

[[echeances]]
cle = "validation-cdst"
titre = "Validation du CdST"
titre_court = "Validation"
semaine_du = 2026-12-14
nuit = 2

[[echeances]]
